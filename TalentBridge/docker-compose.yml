services:
  backend:
    build:
      context: ./server
    container_name: talentbridge-backend
    ports:
      - "5000:5000"
    env_file:
      - ./server/.env
    restart: unless-stopped

  frontend:
    build:
      context: ./client
      args:
        VITE_API_URL: http://localhost:5000/api
    container_name: talentbridge-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
    restart: unless-stopped
